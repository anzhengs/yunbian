<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 Cloud - 设备监控中心</title>
  <style>
    :root {
      --bg-deep:    #060d1a;
      --bg-card:    #0c1526;
      --bg-header:  #0a1221;
      --border:     #1a2a44;
      --accent:     #00d4ff;
      --accent-dim: #0a3d5c;
      --green:      #00e676;
      --orange:     #ff9100;
      --red:        #ff3d71;
      --gray:       #4a5568;
      --text-main:  #e2e8f0;
      --text-sub:   #8892a4;
      --text-dim:   #4a5568;
      --font-mono:  'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --font-ui:    'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes scanline {
      0% { top: -2px; }
      100% { top: 100%; }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes borderGlow {
      0%, 100% { border-color: var(--accent-dim); }
      50% { border-color: var(--accent); }
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 4px currentColor; }
      50% { box-shadow: 0 0 12px currentColor, 0 0 20px currentColor; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== 顶栏 ===== */
    .top-bar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar .brand {
      display: flex; align-items: center; gap: 14px;
      font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    }
    .top-bar .brand svg { color: var(--accent); }
    .top-bar .brand span { color: var(--accent); }
    .top-bar .meta {
      display: flex; gap: 24px; align-items: center;
      font-size: 13px; color: var(--text-sub);
    }
    .top-bar .meta .online-badge {
      display: flex; align-items: center; gap: 7px;
      background: rgba(0,230,118,0.08);
      border: 1px solid rgba(0,230,118,0.25);
      padding: 4px 14px; border-radius: 20px;
      color: var(--green); font-weight: 600;
    }
    .top-bar .meta .online-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: dotPulse 2s infinite;
    }

    /* ===== 统计条 ===== */
    .stats-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 28px;
      display: flex; gap: 32px; align-items: center;
      font-size: 13px;
    }
    .stat-item { display: flex; align-items: center; gap: 8px; }
    .stat-item .label { color: var(--text-sub); }
    .stat-item .value { font-weight: 700; font-family: var(--font-mono); font-size: 15px; }
    .stat-item .value.v-green  { color: var(--green); }
    .stat-item .value.v-orange { color: var(--orange); }
    .stat-item .value.v-red    { color: var(--red); }
    .stat-item .value.v-accent { color: var(--accent); }
    .stat-item .value.v-gray   { color: var(--text-dim); }

    /* ===== 网格主体 ===== */
    .grid-wrap { padding: 20px; }
    .device-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    @media (max-width: 1600px) {
      .device-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1100px) {
      .device-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 700px) {
      .device-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ===== 设备卡片 ===== */
    .dev-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.4s, box-shadow 0.4s;
      animation: fadeSlideIn 0.4s ease both;
    }
    .dev-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
    .dev-card.status-done {
      border-color: rgba(0,230,118,0.3);
      box-shadow: 0 0 15px rgba(0,230,118,0.06);
    }
    .dev-card.status-processing {
      border-color: rgba(0,212,255,0.35);
      animation: borderGlow 2s infinite;
      box-shadow: 0 0 18px rgba(0,212,255,0.08);
    }
    .dev-card.status-error {
      border-color: rgba(255,61,113,0.35);
      box-shadow: 0 0 15px rgba(255,61,113,0.06);
    }

    .dev-card .card-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }
    .dev-card .card-head .dev-label {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
    }
    .dev-card .card-head .dev-label .dev-num {
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .dev-card .card-head .status-badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 10px;
      text-transform: uppercase;
    }
    .badge-idle       { background: rgba(74,85,104,0.25); color: var(--text-dim); }
    .badge-pending    { background: rgba(255,145,0,0.15); color: var(--orange); }
    .badge-processing { background: rgba(0,212,255,0.12); color: var(--accent); animation: pulse 1.5s infinite; }
    .badge-done       { background: rgba(0,230,118,0.12); color: var(--green); }
    .badge-error      { background: rgba(255,61,113,0.12); color: var(--red); }

    .dev-card .img-area {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #050a14;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .dev-card .img-area img {
      width: 100%; height: 100%;
      object-fit: contain;
      transition: opacity 0.3s;
    }
    .dev-card .img-area .no-img {
      color: var(--text-dim);
      font-size: 13px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .dev-card .img-area .no-img svg { opacity: 0.25; }

    /* 扫描线效果（仅处理中状态） */
    .dev-card.status-processing .img-area::after {
      content: '';
      position: absolute; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
      animation: scanline 2.5s linear infinite;
    }

    .dev-card .result-area {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      min-height: 62px;
      max-height: 80px;
      overflow-y: auto;
    }
    .dev-card .result-area pre {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
    .dev-card .result-area .result-line-label { color: var(--text-sub); }
    .dev-card .result-area .result-line-value { color: var(--accent); font-weight: 600; }
    .dev-card .result-area .placeholder-text { color: var(--text-dim); font-size: 12px; font-style: italic; }

    .dev-card .card-foot {
      padding: 6px 14px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      border-top: 1px solid rgba(255,255,255,0.03);
      display: flex; justify-content: space-between;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- 顶栏 -->
  <div class="top-bar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      </svg>
      <span>401</span> Cloud Platform — 设备监控中心
    </div>
    <div class="meta">
      <span id="clock-display">--:--:--</span>
      <div class="online-badge">
        <div class="dot"></div>
        Server Online
      </div>
    </div>
  </div>

  <!-- 统计条 -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="label">设备总数</span>
      <span class="value v-accent" id="stat-total">10</span>
    </div>
    <div class="stat-item">
      <span class="label">已连接</span>
      <span class="value v-accent" id="stat-connected">0</span>
    </div>
    <div class="stat-item">
      <span class="label">已完成</span>
      <span class="value v-green" id="stat-done">0</span>
    </div>
    <div class="stat-item">
      <span class="label">处理中</span>
      <span class="value v-orange" id="stat-processing">0</span>
    </div>
    <div class="stat-item">
      <span class="label">异常</span>
      <span class="value v-red" id="stat-error">0</span>
    </div>
    <div class="stat-item">
      <span class="label">待机</span>
      <span class="value v-gray" id="stat-idle">10</span>
    </div>
  </div>

  <!-- 设备网格 -->
  <div class="grid-wrap">
    <div class="device-grid" id="device-grid"></div>
  </div>

  <script>
    let devicesCache = [];
    const stateCache = {};  // 防抖缓存，避免相同数据重复刷新DOM

    // 时钟
    function updateClock() {
      document.getElementById('clock-display').textContent =
        new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 初始化10张卡片骨架
    function initGrid() {
      const grid = document.getElementById('device-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const card = document.createElement('div');
        card.className = 'dev-card status-idle';
        card.id = `dev-card-${i}`;
        card.innerHTML = `
          <div class="card-head">
            <div class="dev-label">
              <span class="dev-num">#${String(i).padStart(2,'0')}</span>
              <span id="dev-name-${i}">设备 ${i}</span> <!-- ★ 添加 ID，初始值保留兜底 -->
            </div>
            <span class="status-badge badge-idle" id="badge-${i}">待机</span>
          </div>
          <div class="img-area" id="img-area-${i}">
            <div class="no-img" id="no-img-${i}">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              等待图像
            </div>
            <img id="img-${i}" src="" style="display:none;" alt="device ${i}">
          </div>
          <div class="result-area" id="result-${i}">
            <span class="placeholder-text">等待分析结果...</span>
          </div>
          <div class="card-foot">
            <span id="foot-status-${i}">STANDBY</span>
            <span id="foot-time-${i}">--:--:--</span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    // 解析结果文本，格式化高亮显示（标签灰色，值青色）
    function formatResult(raw) {
      if (!raw) return '<span class="placeholder-text">等待分析结果...</span>';
      let html = '';
      const lines = raw.split('\n').filter(l => l.trim());
      for (const line of lines) {
        const colonIdx = line.indexOf(':');
        const colonIdx2 = line.indexOf('：');
        let sepIdx = -1;
        if (colonIdx >= 0 && colonIdx2 >= 0) sepIdx = Math.min(colonIdx, colonIdx2);
        else if (colonIdx >= 0) sepIdx = colonIdx;
        else if (colonIdx2 >= 0) sepIdx = colonIdx2;

        if (sepIdx >= 0) {
          const label = line.substring(0, sepIdx + 1);
          const value = line.substring(sepIdx + 1);
          html += `<span class="result-line-label">${escHtml(label)}</span><span class="result-line-value">${escHtml(value)}</span>\n`;
        } else {
          html += escHtml(line) + '\n';
        }
      }
      return html;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const STATUS_MAP = {
      idle:       { text: '待机',   badgeClass: 'badge-idle',       cardClass: 'status-idle',       footLabel: 'STANDBY' },
      pending:    { text: '排队中', badgeClass: 'badge-pending',    cardClass: 'status-pending',    footLabel: 'QUEUED' },
      processing: { text: '处理中', badgeClass: 'badge-processing', cardClass: 'status-processing', footLabel: 'PROCESSING' },
      done:       { text: '已完成', badgeClass: 'badge-done',      cardClass: 'status-done',       footLabel: 'COMPLETE' },
      error:      { text: '异常',   badgeClass: 'badge-error',     cardClass: 'status-error',      footLabel: 'ERROR' },
    };

    function updateCard(dev) {
      const id = dev.device_id;
      const card = document.getElementById(`dev-card-${id}`);
      if (!card) return;

      const s = STATUS_MAP[dev.status] || STATUS_MAP.idle;

      card.className = `dev-card ${s.cardClass}`;
      
      // ★ 更新设备名称（只在名称变化时刷新DOM）
      const nameEl = document.getElementById(`dev-name-${id}`);
      if (nameEl && dev.display_name) {
          if (stateCache[id]?.name !== dev.display_name) {
              nameEl.textContent = dev.display_name;
              stateCache[id] = { ...stateCache[id], name: dev.display_name };
          }
      }

      const badge = document.getElementById(`badge-${id}`);
      badge.className = `status-badge ${s.badgeClass}`;
      badge.textContent = s.text;

      // 图片更新（只在URL变化时刷新，避免闪烁）
      const imgEl = document.getElementById(`img-${id}`);
      const noImgEl = document.getElementById(`no-img-${id}`);
      if (dev.image_url) {
        const newSrc = dev.image_url + '?t=' + (dev.last_seen || Date.now());
        if (stateCache[id]?.img !== newSrc) {
          imgEl.src = newSrc;
          imgEl.style.display = 'block';
          noImgEl.style.display = 'none';
          stateCache[id] = { ...stateCache[id], img: newSrc };
        }
      } else {
        imgEl.style.display = 'none';
        noImgEl.style.display = '';
      }

      // 结果更新（只在内容变化时刷新）
      let resultHtml;
      if (dev.status === 'done' && dev.result) {
        resultHtml = `<pre>${formatResult(dev.result)}</pre>`;
      } else if (dev.status === 'error') {
        resultHtml = `<span class="placeholder-text" style="color:var(--red);">${escHtml(dev.error || '处理异常')}</span>`;
      } else if (dev.status === 'processing') {
        resultHtml = '<span class="placeholder-text" style="color:var(--accent);">正在分析...</span>';
      } else if (dev.status === 'pending') {
        resultHtml = '<span class="placeholder-text" style="color:var(--orange);">排队等待...</span>';
      } else {
        resultHtml = '<span class="placeholder-text">等待分析结果...</span>';
      }
      if (stateCache[id]?.res !== resultHtml) {
        document.getElementById(`result-${id}`).innerHTML = resultHtml;
        stateCache[id] = { ...stateCache[id], res: resultHtml };
      }

      document.getElementById(`foot-status-${id}`).textContent = s.footLabel;
      document.getElementById(`foot-time-${id}`).textContent = dev.last_seen_fmt || '--:--:--';
    }

    function fetchDevices() {
      fetch('/devices')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
        })
        .then(data => {
          if (!data.success || !Array.isArray(data.devices)) return;
          devicesCache = data.devices;
      
          // ★ 新增：排序——有交互的排前面，无交互的排后面
          devicesCache.sort((a, b) => {
            if (a.connected !== b.connected) return b.connected - a.connected;  // connected=true 优先
            return a.device_id - b.device_id;  // 同组内按编号升序
          });
      
          // ★ 新增：重排 DOM 节点顺序
          const grid = document.getElementById('device-grid');
          for (const dev of devicesCache) {
            const card = document.getElementById(`dev-card-${dev.device_id}`);
            if (card) grid.appendChild(card);  // append 已存在节点会自动移动位置
          }
      
          for (const dev of devicesCache) {
            updateCard(dev);
          }
          updateStats(devicesCache);
        })
        .catch(err => console.error('Fetch /devices failed:', err));
    }

    initGrid();
    fetchDevices();
    setInterval(fetchDevices, 2000);
  </script>
</body>
</html>
